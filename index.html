<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: monospace, Helvetica, sans-serif;
            text-align: center;
            padding: 20px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            margin-bottom: 10px;
            width: 80%;
            background-color: #333;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #1db954;
            color: white;
        }
        button:hover {
            background-color: #17a44a;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        #qrcode img {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
            border-radius: 4px;
        }
        #error {
            color: #ff6b6b;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h2>QR Code Generator</h2>
    <input type="text" id="text" placeholder="Enter text or URL">
    <button onclick="generateQR()">Generate QR Code</button>
    <div id="error"></div>
    <div id="qrcode"></div>
    <script>
        qrcode.stringToBytes = function (s) {
            return Array.from(new TextEncoder().encode(s));
        };

        function generateQR() {
            const text = document.getElementById("text").value;
            const qrBox = document.getElementById("qrcode");
            const errorBox = document.getElementById("error");

            qrBox.innerHTML = "";   // Clear previous QR
            errorBox.textContent = "";

            if (!text) return;

            try {
                const qr = qrcode(0, "M");   // 0 = auto-pick the smallest size that fits
                qr.addData(text, "Byte");
                qr.make();
                qrBox.innerHTML = qr.createImgTag(8, 16); // cell size, quiet-zone margin
            } catch (e) {
                errorBox.textContent = "That text is too long to fit in a QR code. Try something shorter.";
            }
        }

        // Press Enter to generate
        document.getElementById("text").addEventListener("keydown", function (e) {
            if (e.key === "Enter") generateQR();
        });
    </script>
</body>
</html>
